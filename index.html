<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio | Aspiring Software Engineer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #081426;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-width: 1000px;
    }

    .navbar {
      min-height: 87px;
      padding: 0 6.4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid #1b2c45;
      background: #081426;
    }

    .logo {
      color: #f8fafc;
      text-decoration: none;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .logo span {
      color: #369bff;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      white-space: nowrap;
    }

    .nav-links a {
      position: relative;
      padding: 12px 0;
      color: #e2e8f0;
      font-size: 14px;
      text-decoration: none;
    }

    .nav-links a.active {
      color: #45a9ff;
    }

    .nav-links a.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #369bff;
    }

    .contact-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 20px;
      border: 1px solid #258cf5;
      border-radius: 30px;
      color: #f8fafc;
      font-size: 12px;
      text-decoration: none;
      white-space: nowrap;
    }

    .mail-icon {
      color: #58b1ff;
      font-size: 17px;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="#home" class="logo">S.A.<span>S</span></a>

    <nav class="nav-links">
      <a href="#home" class="active">Home</a>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#learning">Learning</a>
      <a href="#vision">Vision</a>
      <a href="#contact">Contact</a>
    </nav>

    <a href="#contact" class="contact-button">
      <span class="mail-icon">✉</span>
      Get in Touch
    </a>
  </header>

</body>
</html>
